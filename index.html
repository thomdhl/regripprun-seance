<style>
:root{
  --paper:#FFF9EB; --surface:#FFFDF6; --ink:#2C3410; --muted:#62664C; --line:#E4DFC6;
  --lane:#546217; --lane-ink:#FFF9EB; --lane-soft:#ECEFD2; --chalk:#E8B53A; --ok:#3F7D3A; --band:#C8642B; --warn:#9A3B1E;
  --nav-h:68px;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B200C; --surface:#252B13; --ink:#FFF9EB; --muted:#C4C3A6; --line:#3A421F;
    --lane:#B9CC5E; --lane-ink:#1B200C; --lane-soft:#353F17; --chalk:#E8B53A; --ok:#7FBF6A; --band:#E58A52; --warn:#F0A07E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B200C; --surface:#252B13; --ink:#FFF9EB; --muted:#C4C3A6; --line:#3A421F;
  --lane:#B9CC5E; --lane-ink:#1B200C; --lane-soft:#353F17; --chalk:#E8B53A; --ok:#7FBF6A; --band:#E58A52; --warn:#F0A07E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.55}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lane);outline-offset:3px}
h1,h2,h3,.disp{font-family:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;line-height:1.1;margin:0}
h2{font-size:clamp(1.8rem,6vw,2.4rem);font-weight:700}
h3{font-size:1.3rem;font-weight:600;margin-bottom:10px}
p{margin:0 0 12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

.app{max-width:760px;margin:0 auto;padding:16px 18px calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top img{width:52px;height:52px;flex:none}
.top .t1{font-family:"Fredoka",sans-serif;font-weight:600;color:var(--lane);font-size:1.05rem;line-height:1.1}
.top .t2{font-size:.92rem;color:var(--muted)}
.top .lvl{margin-left:auto}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);font-weight:800;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--lane-soft)}
.btn.primary{background:var(--lane);border-color:var(--lane);color:var(--lane-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{min-height:60px;font-size:1.2rem;width:100%}
.btn.small{min-height:44px;padding:8px 14px;font-size:.95rem}
.btn.ghost{border-color:var(--line)}
.btn.added{background:var(--ok);border-color:var(--ok);color:var(--lane-ink)}
.linkbtn{background:none;border:0;color:var(--lane);font-weight:800;text-decoration:underline;padding:8px 0;min-height:44px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;font-weight:800;color:var(--lane);padding:8px 0;min-height:44px;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* Cartes */
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px}
.stack > * + *{margin-top:14px}
.choice{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px}
.choice:hover{border-color:var(--lane)}
.choice .ic{width:56px;height:56px;border-radius:50%;background:var(--lane-soft);display:grid;place-items:center}
.choice .ic svg{width:28px;height:28px;stroke:var(--lane);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.choice b{display:block;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.25rem;line-height:1.15}
.choice span{display:block;color:var(--muted);font-size:.98rem;line-height:1.35;margin-top:2px}
.choice .chev{font-size:1.6rem;color:var(--lane);font-weight:800}
.choice.feat{border-color:var(--lane);background:var(--lane-soft)}
.hero{background:var(--lane);color:var(--lane-ink);border-radius:26px;padding:22px}
.hero h2{font-size:1.7rem}
.hero p{opacity:.92}
.hero .btn{background:var(--lane-ink);color:var(--lane);border-color:var(--lane-ink)}
.hero .btn.ghost{background:transparent;color:var(--lane-ink);border-color:var(--lane-ink)}
.q-btns{display:grid;gap:10px;margin-top:12px}
.q-btns button{min-height:56px;border-radius:16px;border:2px solid var(--ink);background:var(--surface);font-weight:800;text-align:left;padding:10px 16px}
.q-btns button small{display:block;font-weight:600;color:var(--muted)}
.how{list-style:none;margin:0;padding:0;counter-reset:h}
.how li{counter-increment:h;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;margin-bottom:12px}
.how li::before{content:counter(h);width:34px;height:34px;border-radius:50%;background:var(--lane);color:var(--lane-ink);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700}
.legal{margin-top:28px;padding-top:16px;border-top:2px solid var(--line);color:var(--muted);font-size:.92rem}
.legal strong{color:var(--ink)}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--lane-soft);color:var(--ink);font-size:.88rem;font-weight:700}

/* Programmes */
.prog{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px}
.prog:hover{border-color:var(--lane)}
.prog b{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.3rem;display:block}
.prog p{color:var(--muted);margin:4px 0 10px}
.prog .row{gap:6px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.plist li b{display:block}
.plist li small{color:var(--muted);font-size:.92rem}

/* Exercices */
.search{position:relative;margin-top:14px}
.search input{width:100%;min-height:54px;padding:12px 16px 12px 46px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);font-weight:600}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.4}
.filterbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.fpanel{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.fpanel h3{font-size:1.1rem;margin:0 0 4px}
.fpanel p{font-size:.92rem;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{min-height:44px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--lane);border-color:var(--lane);color:var(--lane-ink)}
.chip[aria-pressed="true"]::before{content:"✓ "}
.hint{background:var(--lane-soft);border-radius:16px;padding:12px 14px;margin-top:12px;font-weight:600}
.group{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem;color:var(--muted);margin:22px 0 4px}
.exrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.exrow .open{background:none;border:0;text-align:left;padding:10px 0;min-height:56px}
.exrow .open b{display:block;font-weight:800;line-height:1.25}
.exrow .open small{display:block;color:var(--muted);font-size:.92rem;line-height:1.3;margin-top:2px}
.noresult{padding:20px 0;color:var(--muted)}

/* Fiche */
.stage{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--line);
  background-color:var(--surface);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;background-position:-1px -1px}
.stage svg{display:block;width:100%;height:auto;max-height:46vh}
.phase{position:absolute;left:10px;top:10px;right:10px;width:max-content;max-width:calc(100% - 20px);background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.95rem}
.fig{fill:none;stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.fig.far{stroke:var(--muted);opacity:.55}
.head{fill:var(--surface);stroke:var(--ink);stroke-width:5}
.ground{stroke:var(--ink);stroke-width:2.5}
.prop{fill:var(--surface);stroke:var(--muted);stroke-width:2.5;stroke-linejoin:round}
.prop-line{stroke:var(--muted);stroke-width:4;stroke-linecap:round;fill:none}
.db{fill:var(--chalk);stroke:var(--ink);stroke-width:2}
.band{fill:none;stroke:var(--band);stroke-width:3;stroke-linecap:round}
.aka{color:var(--muted);margin-top:6px}
.foryou{background:var(--lane-soft);border-radius:20px;padding:16px 18px}
.foryou .big{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.35rem;line-height:1.25;margin:4px 0 6px}
details summary{cursor:pointer;font-weight:800;color:var(--lane);min-height:44px;display:flex;align-items:center}
.lvtable{width:100%;border-collapse:collapse;margin-top:4px}
.lvtable th,.lvtable td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:.98rem;vertical-align:top}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 20px}
.facts dt{font-size:.9rem;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:800}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:8px;margin-bottom:12px}
.steps li::before{content:counter(s);font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.3rem;color:var(--lane);line-height:1.3}
.avoid{margin:0;padding-left:1.2em}
.avoid li{margin-bottom:6px}
.tip{border-left:5px solid var(--chalk);padding-left:12px}
.var{display:grid;gap:10px}
.var button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:56px;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:10px 16px;text-align:left;font-weight:700}
.var button small{display:block;color:var(--muted);font-weight:600;font-size:.88rem}
.sticky{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:10px 18px;background:linear-gradient(transparent,var(--paper) 30%);z-index:20}
.sticky > div{max-width:724px;margin:0 auto}

/* Ma séance */
.summary{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.summary .disp{font-size:1.6rem;font-weight:700;color:var(--lane)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;min-height:56px;border-bottom:1px solid var(--line);font-weight:700}
.switch small{display:block;color:var(--muted);font-weight:600}
.switch input{appearance:none;width:56px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;border:0;margin:0}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch input:checked{background:var(--lane)}
.switch input:checked::after{left:28px}
.item{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px}
.item-head{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.item-n{width:40px;height:40px;border-radius:50%;background:var(--lane);color:var(--lane-ink);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.2rem}
.item-head b{display:block;font-size:1.1rem;line-height:1.25}
.item-head small{display:block;color:var(--muted);font-size:.95rem;margin-top:2px}
.item-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.05rem;font-weight:800}
.iconbtn:disabled{opacity:.3;cursor:default}
.editor{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px}
.stepper span{font-weight:700}
.stepper .ctl{display:flex;align-items:center;gap:8px}
.stepper output{min-width:96px;text-align:center;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.2rem}
.empty{text-align:center;padding:28px 18px}
.empty .row{justify-content:center;margin-top:14px}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs > div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:.85rem;color:var(--muted);position:relative}
nav.tabs svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--lane)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:4px;border-radius:0 0 4px 4px;background:var(--lane)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:22px;height:22px;border-radius:999px;background:var(--band);color:#fff;font-size:.78rem;display:grid;place-items:center;padding:0 6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);border-radius:16px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:2px solid var(--paper);color:var(--paper);border-radius:999px;min-height:40px;padding:4px 14px;font-weight:800}

/* Mode séance */
.player{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto}
.player.rest{background:var(--lane-soft)}
.p-top{display:flex;align-items:center;gap:10px}
.p-top .grow{flex:1;min-width:0}
.p-top .lbl{font-weight:800;font-size:.95rem}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--lane);width:0;transition:width .3s}
.p-body{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;gap:12px;padding-top:12px}
.p-phase{font-weight:800;color:var(--lane);font-size:.95rem}
.p-name{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.1}
.p-stage{flex:1;min-height:200px}
.p-stage .stage{height:100%}
.p-stage .stage svg{max-height:38vh}
.p-instr{text-align:center}
.p-instr .set{font-weight:800;color:var(--muted)}
.p-instr .amount{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.1}
.p-instr .clock{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(3.6rem,18vw,6rem);line-height:1;font-variant-numeric:tabular-nums}
.p-instr .note{font-weight:800;color:var(--warn);min-height:1.5em}
.p-actions{display:grid;gap:10px}
.p-actions .row{justify-content:center}
.p-how{background:var(--surface);border-radius:16px;padding:12px 16px}
.p-end{text-align:center;margin:auto;max-width:440px}
.p-end img{width:140px;height:140px}
.p-end h2{margin:12px 0 8px}
.top{min-height:56px}
.top.is-home .t1{font-size:1.45rem;color:var(--ink);font-weight:700}
.top.is-home .t2{font-weight:700}
.avatar{margin-left:auto;width:48px;height:48px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--lane-soft);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.25rem;color:var(--ink);padding:0}
.avatar[aria-current="page"]{border-color:var(--lane)}
.avatar svg{width:24px;height:24px;stroke:var(--lane);fill:none;stroke-width:2.2;stroke-linecap:round}
.home{display:flex;flex-direction:column;gap:20px}
.field{width:100%;min-height:52px;padding:10px 16px;border:2px solid var(--ink);border-radius:16px;background:var(--surface);font-weight:600}
.lab{display:block;font-weight:800;margin-bottom:6px}
.small{font-size:.92rem}
.q-btns button[aria-pressed="true"]{background:var(--lane);border-color:var(--lane);color:var(--lane-ink)}
.q-btns button[aria-pressed="true"] small{color:var(--lane-ink)}
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.week-head h3{margin:0}
.week-head span{font-weight:800;color:var(--lane)}
.days{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.days li{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:.85rem;color:var(--muted)}
.days .dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;position:relative}
.days li.done .dot{background:var(--lane);border-color:var(--lane)}
.days .dot svg{width:18px;height:18px;stroke:var(--lane-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.days li.today{color:var(--ink)}
.days li.today .dot{border:3px solid var(--lane)}
.days li.today:not(.done) .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--lane)}
.wbar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.wbar i{display:block;height:100%;background:var(--lane);border-radius:999px}
.wmsg{margin:10px 0 0;font-weight:700}
.hero{position:relative;overflow:hidden}
.hero .pill{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--chalk);color:#2C3410;font-weight:800;font-size:.85rem;margin-bottom:10px}
.hero h2{font-size:2rem;max-width:82%;position:relative}
.hero p{max-width:86%;margin:8px 0 14px;position:relative}
.hero-fig{position:absolute;right:-6px;top:10px;width:120px;height:140px;fill:none;stroke:var(--lane-ink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.2}
.hchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;position:relative}
.hchips span{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:2px solid currentColor;font-weight:800;font-size:.9rem}
.hchips svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.hero .btn.start svg{width:22px;height:22px;fill:currentColor}
.hlinks{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.hlink{background:none;border:0;color:var(--lane-ink);font-weight:800;text-decoration:underline;min-height:44px;padding:0}
.sec{margin:0 0 12px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ttile{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ttile b{font-family:"Fredoka",sans-serif;font-size:2rem;line-height:1;color:var(--lane)}
.ttile span{font-weight:800;font-size:.9rem}
.ttile small{color:var(--muted);font-weight:700;font-size:.85rem}
.ttile:hover,.ztile:hover,.perso:hover{border-color:var(--lane)}
.ztiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ztile{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;border-radius:18px;background:var(--surface);border:2px solid var(--line);font-weight:800;text-align:left;line-height:1.2}
.ztile[aria-pressed="true"]{background:var(--lane);border-color:var(--lane);color:var(--lane-ink)}
.ztile[aria-pressed="true"] .zi{background:var(--lane-ink)}
.ztile[aria-pressed="true"]::after{content:"✓";margin-left:auto;font-weight:800}
.mixbar{margin-top:12px;background:var(--surface);border:2px solid var(--lane);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.mixsum{margin:0}
.mixdur{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:800;min-height:44px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.zi{width:40px;height:40px;border-radius:50%;background:var(--lane-soft);display:grid;place-items:center;flex:none}
.zi svg{width:22px;height:22px;stroke:var(--lane);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.perso{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;border:2px dashed var(--muted);background:none}
.perso b{display:block}
.perso small{display:block;color:var(--muted);font-weight:600;font-size:.92rem}
.perso .go{margin-left:auto;font-weight:800;color:var(--lane);flex:none}
.tipbox{background:var(--lane-soft);border-radius:20px;padding:16px}
.tipbox b{display:block;font-size:1.05rem}
.tipbox p{margin:4px 0 6px}
.tipbox details p{margin:6px 0}
.how-d summary{font-family:"Fredoka",sans-serif;font-size:1.2rem;color:var(--ink);font-weight:600}
.qr{display:flex;justify-content:center;margin:8px 0 6px}
.qr svg,.qr img{width:220px;height:220px;background:#fff;border-radius:12px;padding:6px}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.modal{position:fixed;inset:0;z-index:300;background:rgba(20,24,8,.6);display:grid;place-items:center;padding:20px}
.modal-box{background:var(--surface);color:var(--ink);border-radius:24px;padding:22px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal-box h3{font-size:1.4rem;margin-bottom:8px}
.modal-box p{margin:0 0 16px}
.modal-box .field{margin-bottom:16px}
.modal-box .row{justify-content:flex-end}
.btn.danger-fill{background:var(--warn);border-color:var(--warn);color:var(--paper)}
.illus .fig,.illus .head,.illus .db,.illus .band{display:none}
.ill{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.ill .arch{stroke:var(--lane);stroke-width:6}
.ill .arrow{stroke:var(--band);stroke-width:3}
[data-ph]{transition:opacity .35s}
.how-d h4{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;margin:16px 0 6px}
.feel [aria-pressed="true"]{background:var(--lane);border-color:var(--lane);color:var(--lane-ink)}
.feelmsg{max-width:380px;margin:12px auto 0;font-weight:600}
.feelmsg .btn{margin-top:10px}
.onb{position:fixed;inset:0;z-index:150;background:var(--paper);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.onb-top{display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto;min-height:48px}
.onb-top .grow{flex:1;min-width:0}
.onb-top .lbl{font-weight:800;font-size:.9rem}
.onb-top .bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:4px}
.onb-top .bar i{display:block;height:100%;background:var(--lane);border-radius:999px}
.onb-body{flex:1;display:flex;flex-direction:column;gap:16px;max-width:560px;width:100%;margin:0 auto;padding-top:20px}
.onb-body h2{font-size:clamp(1.7rem,6.5vw,2.2rem)}
.onb-body h2:focus{outline:none}
.onb-body p{margin:0}
.onb-hero{text-align:center}
.onb-hero img{width:150px;height:150px;margin-bottom:10px}
.onb-hero p{margin-top:8px}
.onb-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.onb-list li{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.onb-list .zi{width:48px;height:48px}
.onb-list .zi svg{width:24px;height:24px}
.onb-list b{display:block;line-height:1.25}
.onb-list small{display:block;color:var(--muted);font-weight:600;font-size:.93rem;line-height:1.35;margin-top:2px}
.onb-actions{margin-top:auto;display:grid;gap:10px;padding-top:8px}
.onb .btn .sub{display:block;font-size:.85rem;font-weight:700;opacity:.9;margin-top:2px}
.onb .btn.big{flex-direction:column;gap:0}
.onb .tipbox summary{font-weight:800;color:var(--lane);cursor:pointer;min-height:44px;display:flex;align-items:center}
.onb .lab{margin-bottom:8px}
.onb .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
.onb .seg button{font-size:1.1rem}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>

function interleave(pools){
  const order = [];
  while (pools.some(p => p.length)){
    for (const pool of pools){
      while (pool.length && (order.some(x => x.id === pool[0].id) || order.filter(x => family(x) === family(pool[0])).length >= 2)) pool.shift();
      if (pool.length) order.push(pool.shift());
    }
  }
  return order;
}
function genProtect(zones, dur){
  const L = lvl(), target = dur * 60, warm = dur >= 20, cap = [2,2,3][L];
  const ok = (e, key) => e && canDo(e) && (DIFF_OK[L].includes(e.diff) || (key && e.diff !== "Difficile"));
  const pools = zones.map(z => {
    const t = PT.find(x => x[0] === z);
    const keys = t[3].filter(id => ok(BY_ID[id], true));
    const rest = shuffle(t[4].filter(id => !keys.includes(id) && ok(BY_ID[id], false)));
    return [...keys, ...rest].map(id => BY_ID[id]);
  });
  const order = interleave(pools);
  let best = null;
  for (let c = Math.min(2, order.length); c <= Math.min(10, order.length); c++){
    for (let extra = 0; extra <= 2; extra++){
      const items = order.slice(0, c).map(e => { const it = newItem(e.id); it.sets = Math.min(it.sets, cap) + extra; return it; });
      const score = Math.abs(mixSecs(items, warm, false) - target) + extra * 45 + (c < 3 && order.length >= 3 ? 60 : 0);
      if (!best || score < best.score) best = {score, items};
    }
  }
  return best ? best.items : [];
}
/* Une même famille de mouvements (pompes, fentes, squats…) ne revient pas plus de deux fois */
function family(e){
  const id = e.id;
  if (/^pompes|^pike/.test(id)) return "pompes";
  if (/^fente|^bulgare/.test(id)) return "fente";
  if (/^squat|^goblet|^sumo/.test(id) && id !== "squatprofond") return "squat";
  if (/^pont|^hipthrust/.test(id)) return "pont";
  if (/^planche|^lateral|^shouldertap|^ours/.test(id)) return "planche";
  if (/^rowing|^rowinv/.test(id)) return "rowing";
  if (/^curl/.test(id)) return "curl";
  if (/^abduct/.test(id)) return "abduct";
  return id;
}
const mixSecs = (items, warm, cool) => buildSteps(items, warm, cool).reduce((t,st) => t + (st.type==="rest" ? st.dur : workSeconds(st)), 0);
function genMix(zones, dur){
  const L = lvl(), strength = zones.filter(z => z !== "etirements"), stretch = zones.includes("etirements");
  const warm = strength.length > 0 && dur >= 20, cool = strength.length > 0 && dur === 30 && !stretch, target = dur * 60;
  const mk = (e, sets, amount, rest) => ({uid:uid(), id:e.id, sets, amount, rest, kind:"t"});
  const stretches = shuffle(EX.filter(e => e.cat === "Étirements"));
  /* Exercices alternés entre les parties choisies */
  const pools = strength.map(z => {
    const f = ZT.find(t => t[0] === z)[3];
    let list = EX.filter(e => f(e) && canDo(e) && DIFF_OK[L].includes(e.diff));
    if (list.length < 4) list = EX.filter(e => f(e) && canDo(e) && e.diff !== "Difficile");
    return shuffle(list);
  });
  const order = [];
  while (pools.some(p => p.length)){
    for (const pool of pools){
      while (pool.length && (order.some(x => x.id === pool[0].id) || order.filter(x => family(x) === family(pool[0])).length >= 2)) pool.shift();
      if (pool.length) order.push(pool.shift());
    }
  }
  const tail = strength.length && stretch ? stretches.slice(0, dur === 10 ? 2 : 3).map(e => mk(e, 1, 30, 10)) : [];
  const list = strength.length ? order : stretches;
  const work = strength.length ? [30,40,45][L] : 40, rest = strength.length ? [20,20,15][L] : 10;
  /* On cherche le nombre d’exercices et de tours qui colle le mieux à la durée choisie */
  let best = null;
  for (let c = Math.min(3, list.length); c <= Math.min(10, list.length); c++){
    for (let r = 1; r <= 5; r++){
      const items = list.slice(0, c).map(e => mk(e, r, work, rest)).concat(tail);
      const score = Math.abs(mixSecs(items, warm, cool) - target) + (r === 1 && strength.length ? 90 : 0) + (r === 4 ? 50 : 0) + (r >= 5 ? 110 : 0) + (c < 4 && list.length >= 4 ? 60 : 0);
      if (!best || score < best.score) best = {score, items};
    }
  }
  return best ? best.items : [];
}

function pack(){

}
function unpack(code){

  const n = (x,a,b,d) => Number.isFinite(+x) ? Math.min(b, Math.max(a, Math.round(+x))) : d;

  if (F.gear.size && ![...e.gear, ...(e.opt? [] : [])].some(g => FREE.includes(g) || F.gear.has(g))) return false;
  return true;
}

/* ----- Boîte de dialogue ----- */
function ask({title, text = "", ok = "Oui", cancel = "Annuler", danger = false, field = ""}){
  return new Promise(res => {
    const prev = document.activeElement, m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="mT" aria-describedby="mD"><h3 id="mT"></h3><p id="mD"></p>
      ${field ? `<label class="sr" for="mF">Lien</label><input class="field" id="mF" readonly>` : ""}
      <div class="row">${cancel ? `<button type="button" class="btn" data-m="0"></button>` : ""}<button type="button" class="btn ${danger ? "danger-fill" : "primary"}" data-m="1"></button></div></div>`;
    m.querySelector("#mT").textContent = title; m.querySelector("#mD").textContent = text;
    if (field) m.querySelector("#mF").value = field;
    if (cancel) m.querySelector('[data-m="0"]').textContent = cancel;
    m.querySelector('[data-m="1"]').textContent = ok;
    const close = v => { m.remove(); if (prev && prev.focus) prev.focus(); res(v); };
    m.addEventListener("click", e => {
      e.stopPropagation();
      const b = e.target.closest("[data-m]");
      if (b) close(b.dataset.m === "1"); else if (e.target === m && cancel) close(false);
    });
    m.addEventListener("keydown", e => { if (e.key === "Escape" && cancel) close(false); });
    document.body.appendChild(m);
    const f = field ? m.querySelector("#mF") : m.querySelector('[data-m="1"]');
    f.focus(); if (field) f.select();
  });
}
const askQuit = () => ask({title:"Arrêter la séance ?", text:"Cette séance ne sera pas comptée dans votre semaine.", ok:"Arrêter", cancel:"Continuer la séance", danger:true});

/* ----- Routeur ----- */
function route(){
  const r = location.hash.slice(1) || "accueil";
  if (r === "go"){ if (!PL.open) location.replace("#ma-seance"); return; }
  if (PL.open){ closePlayer(); }
  toastEl.hidden = true;
  if (r === "exercices" || r === "composer"){ compose = r==="composer"; lastList = r; vExercices(); }
  else if (r === "seances") vSeances();
  else if (r.startsWith("prog-")) vProg(r.slice(5));
  else if (r.startsWith("ex-")) vFiche(r.slice(3));
  else if (r === "ma-seance"){ lastList = "ma-seance"; vSeance(); }
  else if (r === "profil") vProfil();
  else if (r.startsWith("restore-")) vRestore(r);
  else vAccueil();
  updateNav(r); updateHeader(r);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", ()=>{
  if (PL.open && location.hash !== "#go"){
    const target = location.hash.slice(1) || "accueil";
    if (PL.mode === "end"){ closePlayer(); route(); return; }
    location.hash = "go";
    askQuit().then(ok => { if (ok){ closePlayer(); go(target); } });
    return;
  }
  route();
});

const PL = {open:false, steps:[], i:0, mode:"", end:0, total:0, iv:null, sound:true, t0:0, beeped:-1, half:false, fig:null, wl:null};
let AC = null;
function audioUnlock(){ try { AC ||= new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==="suspended") AC.resume(); } catch(e){} }
function beep(f=880, d=.15, v=.3){
  if (!PL.sound || !AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);

}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };
async function wake(){ try { if ("wakeLock" in navigator) PL.wl = await navigator.wakeLock.request("screen"); } catch(e){} }
document.addEventListener("visibilitychange", ()=>{ if (PL.open && document.visibilityState==="visible") wake(); });
const fmt = s => `${Math.floor(s/60)}:${String(Math.max(0,s)%60).padStart(2,"0")}`;

function startSession(items = S.items, warm = S.warm, cool = S.cool){
  if (!items.length) return go("seances");
  audioUnlock(); wake();
  PL.back = (location.hash.slice(1) || "accueil").replace(/^go$/,"accueil"); PL.steps = buildSteps(items, warm, cool); PL.count = items.length; PL.i = 0; PL.t0 = Date.now(); PL.open = true;

}
function closePlayer(){

}
function phaseName(st){ return st.phase==="warm" ? "Échauffement" : st.phase==="cool" ? "Étirements" : "Séance"; }
function stepLabel(st){
  if (st.phase==="main") return `Exercice ${st.k+1} sur ${st.n}`;
  return `${phaseName(st)} : ${st.k+1} sur ${st.n}`;
}
function renderStep(){
  clearInterval(PL.iv); PL.iv = null; PL.beeped = -1; PL.half = false;
  const st = PL.steps[PL.i];
  $("#pBar").style.width = `${Math.round(PL.i / PL.steps.length * 100)}%`;
  if (!st) return renderEnd();
  const body = $("#pBody");
  if (st.type === "rest"){
    const nx = PL.steps[PL.i+1];
    player.classList.add("rest"); PL.mode = "rest"; PL.end = Date.now() + st.dur*1000;
    $("#pLbl").textContent = "Pause";
    body.innerHTML = `<div class="p-instr"><div class="set">Pause, respirez tranquillement</div><div class="clock" id="pClock">${fmt(st.dur)}</div></div>
      ${nx ? `<div><div class="p-phase">À suivre${nx.phase!==st.phase || nx.k===0 && nx.set===1 ? ` (${phaseName(nx)})` : ""}</div><div class="p-name" style="font-size:1.5rem">${nx.ex.name}</div><div class="muted">${nx.it.sets>1 ? `Série ${nx.set} sur ${nx.it.sets}, ` : ""}${amountText(nx.kind, nx.it.amount, sideOf(nx.ex))}</div></div>
      <div class="p-stage"><div id="pStage"></div></div>` : ""}
      <div class="p-actions"><button type="button" class="btn primary big" data-act="p-next">Je suis prêt, on continue</button>
      <div class="row"><button type="button" class="btn small" data-act="p-more">+15 secondes</button></div></div>`;
    if (nx){ PL.fig = new Fig($("#pStage")); PL.fig.set(nx.ex); }
    PL.iv = setInterval(tick, 200);
    return;
  }
  player.classList.remove("rest");
  const ex = st.ex, side = sideOf(ex), timed = st.kind !== "r";
  PL.total = st.it.amount * (timed && side ? 2 : 1);
  PL.mode = timed ? "idle" : "reps";
  $("#pLbl").textContent = stepLabel(st);
  body.innerHTML = `<div><div class="p-phase">${phaseName(st)}</div><div class="p-name">${ex.name}</div></div>
    <div class="p-stage"><div id="pStage"></div></div>
    <div class="p-instr"><div class="set">${st.it.sets>1 ? `Série ${st.set} sur ${st.it.sets}` : "Une série"}</div>
      ${timed ? `<div class="clock" id="pClock">${fmt(PL.total)}</div><div class="muted">${side ? `${secText(st.it.amount)} ${side==="par jambe"?"par jambe":"de chaque côté"} : changez à mi-temps` : "Tenez ou répétez le mouvement jusqu’à la fin du chrono"}</div>`
             : `<div class="amount">${amountText("r", st.it.amount, side)}</div>`}
      <div class="note" id="pNote"></div></div>
    <div class="p-actions">
      ${timed ? `<button type="button" class="btn primary big" id="pMain" data-act="p-chrono">Démarrer le chrono</button>`
              : `<button type="button" class="btn primary big" data-act="p-next">J’ai fini cette série</button>`}
      <div class="row"><button type="button" class="btn small" data-act="p-how" aria-expanded="false">Comment faire ?</button><button type="button" class="btn small ghost" data-act="p-skip">Passer cet exercice</button></div>
      <div class="p-how" id="pHow" hidden><ol class="steps">${ex.steps.map(s=>`<li><span>${s}</span></li>`).join("")}</ol></div>
    </div>`;
  PL.fig = new Fig($("#pStage")); PL.fig.set(ex);
}
function tick(){
  const left = Math.ceil((PL.end - Date.now())/1000), clock = $("#pClock"), note = $("#pNote");
  if (PL.mode === "prep"){
    if (note) note.textContent = left > 0 ? `Préparez-vous… ${left}` : "C’est parti !";
    if (left !== PL.beeped && left > 0){ PL.beeped = left; beep(660,.12); }
    if (left <= 0){ PL.mode = "run"; PL.end = Date.now() + PL.total*1000; PL.beeped = -1; beep(990,.3); const b = $("#pMain"); if (b) b.textContent = "J’ai terminé"; if (note) note.textContent = ""; }
    return;
  }
  if (clock) clock.textContent = fmt(left);
  if (PL.mode === "run"){
    if (sideOf(PL.steps[PL.i].ex) && !PL.half && left <= PL.total/2){ PL.half = true; beep(880,.15); setTimeout(()=>beep(880,.15),250); buzz(200); if (note) note.textContent = "Changez de côté !"; }
  }
  if ((PL.mode === "run" || PL.mode === "rest") && left <= 3 && left > 0 && left !== PL.beeped){ PL.beeped = left; beep(660,.12); }

}
function next(){ PL.i++; renderStep(); }
function renderEnd(){

    <div class="feel"><p style="font-weight:800;margin:14px 0 8px">Comment vous sentez-vous&#8239;?</p>
      <div class="row" style="justify-content:center"><button type="button" class="btn small" data-act="feel" data-v="0">Bien</button><button type="button" class="btn small" data-act="feel" data-v="1">Une gêne légère</button><button type="button" class="btn small" data-act="feel" data-v="2">Une douleur</button></div>
      <p id="feelMsg" class="feelmsg" aria-live="polite"></p></div>
    <p class="muted">Buvez un verre d’eau et notez comment vous vous sentez. À la prochaine sortie du club !</p>
    <button type="button" class="btn primary big" data-act="p-close">Retour à l’accueil</button></div>`;
  beep(784,.2); setTimeout(()=>beep(988,.2),220); setTimeout(()=>beep(1175,.35),440);
}
function playerAction(act, a){
  if (!PL.open) return;
  const st = PL.steps[PL.i];
  switch(act){
    case "p-quit":
      if (PL.mode === "end"){ closePlayer(); go("accueil"); break; }
      askQuit().then(ok => { if (ok && PL.open){ const back = PL.back; closePlayer(); go(back); } });
      break;
    case "p-close": closePlayer(); go("accueil"); break;
    case "p-next": next(); break;
    case "p-more": PL.end += 15000; tick(); break;
    case "p-chrono":
      if (PL.mode === "idle"){ audioUnlock(); PL.mode = "prep"; PL.end = Date.now() + 3000; a.textContent = "Préparez-vous…"; PL.iv = setInterval(tick, 200); tick(); }

      let j = PL.i + 1;
      while (j < PL.steps.length && (PL.steps[j].type==="rest" || PL.steps[j].it === st.it)) j++;
      PL.i = j; renderStep(); break; }
    case "feel": {
      const msg = ["Parfait. La prochaine fois, vous pourrez augmenter un peu, mais une seule chose à la fois : les séries, les répétitions ou la lenteur de la descente.",
        "Une gêne légère pendant l’exercice, qui disparaît dans les 24 heures, est acceptable. Si elle est encore là demain matin, restez au même niveau la prochaine fois.",
        "Arrêtez les exercices qui font mal. Si la douleur augmente d’une séance à l’autre, persiste le lendemain matin ou modifie votre foulée, revenez au niveau inférieur et parlez-en à un professionnel de santé."][+a.dataset.v];
      document.querySelectorAll('[data-act="feel"]').forEach(b => b.setAttribute("aria-pressed", String(b === a)));
      const box = $("#feelMsg"); box.textContent = msg;
      if (+a.dataset.v === 2 && lvl() > 0){ const b = document.createElement("button"); b.type = "button"; b.className = "btn small"; b.dataset.act = "feel-down"; b.textContent = `Passer au niveau ${LEVELS[lvl()-1].toLowerCase()}`; box.append(document.createElement("br"), b); }
      break; }
    case "feel-down": setLevel(lvl() - 1); $("#feelMsg").textContent = `C’est noté : niveau ${LEVELS[lvl()].toLowerCase()}. Les quantités ont été adaptées.`; break;
    case "p-sound": PL.sound = !PL.sound; a.textContent = PL.sound ? "🔊" : "🔇"; a.setAttribute("aria-label", PL.sound ? "Couper le son" : "Activer le son"); if (PL.sound){ audioUnlock(); beep(880,.1); } break;
  }

  } else if (st === 3){
    const g = S.goal || 3;
    body = `<h2 id="obT" tabindex="-1">Votre semaine et votre matériel</h2>
      <div><p class="lab" id="obGoalL">Combien de séances par semaine&#8239;?</p>
        <div class="seg" role="group" aria-labelledby="obGoalL">${[2,3,4].map(n=>`<button type="button" data-act="onb-goal" data-v="${n}" aria-pressed="${g===n}" aria-label="${n} séances par semaine">${n}</button>`).join("")}</div>
        <p class="muted small" style="margin:8px 0 0">Deux à trois séances par semaine suffisent pour progresser.</p></div>
      <div><p class="lab">Qu’avez-vous chez vous&#8239;?</p>
        <div class="chips"><button type="button" class="chip" data-act="onb-gear" data-v="none" aria-pressed="${F.gear.has("none")}">Rien du tout</button>${GEAR_CHIPS.map(([v,l])=>`<button type="button" class="chip" data-act="onb-gear" data-v="${v}" aria-pressed="${F.gear.has(v)}">${l}</button>`).join("")}</div>
        <p class="muted small" style="margin:0">Les séances composées pour vous en tiendront compte.</p></div>
      <div class="onb-actions"><button type="button" class="btn primary big" data-act="onb-next">Continuer</button></div>`;
  } else {
    const p = firstProg();
    body = `<h2 id="obT" tabindex="-1">Comment ça marche&#8239;?</h2>
      <ul class="onb-list">
        ${obItem(OB_ICONS.play, "Lancez une séance", "La séance du jour, une durée ou les parties du corps de votre choix.")}
        ${obItem(OB_ICONS.fig, "Imitez le personnage", "Il montre le geste. « Comment faire ? » détaille chaque étape.")}
        ${obItem(OB_ICONS.clock, "Laissez-vous guider", "Les pauses sont chronométrées et des signaux sonores vous préviennent.")}
        ${obItem(OB_ICONS.heart, "Écoutez votre corps", "Une gêne légère est normale. Une douleur : on arrête et on adapte.")}
      </ul>
      ${isStandalone() ? "" : `<details class="tipbox"><summary>Astuce : installer l’outil sur votre téléphone</summary>${INSTALL_HOWTO}</details>`}
      <div class="onb-actions">
        <button type="button" class="btn primary big" data-act="onb-first">Faire ma première séance<span class="sub">${p.name}, environ ${progMinutes(p)} minutes</span></button>
        <button type="button" class="btn big" data-act="onb-home">Découvrir l’accueil</button></div>`;
  }
  el.innerHTML = `<div class="onb-top">
      ${st > 0 ? `<button type="button" class="back" data-act="onb-back" style="margin:0">‹ Retour</button>` : `<span></span>`}
      <div class="grow">${st > 0 ? `<div class="lbl">Étape ${st} sur ${OB_STEPS-1}</div><div class="bar"><i style="width:${Math.round(st/(OB_STEPS-1)*100)}%"></i></div>` : ""}</div>
      ${st < OB_STEPS-1 ? `<button type="button" class="linkbtn" data-act="onb-skip">Passer</button>` : ""}
    </div><div class="onb-body">${body}</div>`;
  el.scrollTop = 0;
  const t = $("#obT"); if (t) t.focus({preventScroll:true});
  const n = $("#obName"); if (n) n.addEventListener("input", ()=>{ S.name = n.value.trim().slice(0,30); save(); });
}
function onbAction(act, a){
  const v = a.dataset.v;
  switch(act){
    case "onb-open": openOnb(0); return true;
    case "onb-next": OB.step = Math.min(OB_STEPS-1, OB.step+1); renderOnb(); return true;
    case "onb-back": OB.step = Math.max(0, OB.step-1); renderOnb(); return true;
    case "onb-skip": closeOnb(); route(); return true;
    case "onb-level":
      document.querySelectorAll('[data-act="onb-level"]').forEach(b => b.setAttribute("aria-pressed", String(b === a)));
      S.level = +v; S.items.forEach(it => { if (!it.custom && !it.kind){ [it.sets, it.amount, it.rest] = recos(BY_ID[it.id])[+v]; } }); save();
      setTimeout(()=>{ if (OB.open && OB.step === 2){ OB.step = 3; renderOnb(); } }, 220);
      return true;
    case "onb-goal": S.goal = +v; save(); renderOnb(); return true;
    case "onb-gear":
      if (v === "none"){ const on = !F.gear.has("none"); F.gear.clear(); if (on) F.gear.add("none"); }
      else { F.gear.delete("none"); F.gear.has(v) ? F.gear.delete(v) : F.gear.add(v); }
      S.owned = [...F.gear]; save(); renderOnb(); return true;
    case "onb-first": { const p = firstProg(); closeOnb(); route(); startSession(progItems(p), progWarm(p), progCool(p)); return true; }
    case "onb-home": closeOnb(); route(); window.scrollTo(0,0); return true;
  }
  return false;
}

if (location.hash === "#go") history.replaceState(null, "", "#accueil");
route();
if (S.level === null && !S.onboarded && !location.hash.startsWith("#restore-")) openOnb(0);
</script>
</body>
</html>
